<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>64x64 Pixel Art Creator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #ccc;
            image-rendering: pixelated; /* Maintain pixelated look */
        }
    </style>
</head>
<body>
    <canvas id="pixelArtCanvas" width="256" height="256"></canvas>
    <script src="./pixelate.js"></script>
</body>
</html>
